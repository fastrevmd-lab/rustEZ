name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check package version alignment
        run: python3 scripts/check_versions.py

      - name: cargo check (workspace)
        run: cargo check

      - name: cargo test (rustez, unit only)
        run: cargo test -p rustez

      - name: cargo clippy (rustez, deny warnings)
        run: cargo clippy -p rustez -- -D warnings

      - name: cargo clippy (rustez-py, deny warnings)
        run: cargo clippy -p rustez-py -- -D warnings

      - name: cargo doc (rustez)
        run: cargo doc -p rustez --no-deps

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # No advisories are ignored. RUSTSEC-2023-0071 (rsa Marvin attack) was
      # ignored here until `rsa` left the dependency tree entirely when russh
      # reworked its crypto; `cargo audit` now passes clean unsuppressed. See
      # .cargo/audit-ignored.md for the retired entry. If an ignore is ever
      # needed again, document it there first and keep the flags in sync.
      - name: cargo audit
        run: cargo audit

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"

      # `cargo +1.86.0` rather than a bare `cargo`: rust-toolchain.toml pins
      # 1.98.0 and outranks the `rustup default` that the action sets, so a
      # bare invocation would silently test 1.98 and this job would prove
      # nothing. An explicit +toolchain is the one thing that beats the file.
      # `Cargo.lock` is gitignored, so this job resolves fresh every run and
      # takes whatever the registry currently offers. That is what makes it
      # useful -- a dependency raising its own floor is caught here rather than
      # downstream -- and also what lets an unrelated release turn every open PR
      # red with no commit behind it. `aes` 0.9.3 declared `rust-version = 1.89`,
      # reached through russh -> ssh-key -> aes-gcm -> aes, which makes any floor
      # below that unsatisfiable. Confirmed against unmodified `main`, which
      # fails identically at its own declared MSRV.
      #
      # Pinning the last compatible release keeps this job measuring *our* floor
      # rather than the registry's. Drop the pin when it is no longer needed; the
      # failure names the crate and the version it wants, which is the diagnosis.
      - name: Pin dependencies that dropped support for the declared MSRV
        run: cargo update -p aes --precise 0.9.2

      - name: cargo check at the declared MSRV
        run: cargo +1.86.0 check -p rustez

  python-bindings:
    name: Python bindings (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # maturin develop drops the compiled extension into python/rustez/ and
      # installs a .pth pointing at it, which is what the pytest config's
      # `pythonpath = ["python"]` expects. Installing a built wheel instead
      # would shadow it: the source package would win on sys.path and then
      # fail to find rustez._rustez_native.
      - name: Build bindings and run pytest
        working-directory: rustez-py
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip maturin pytest lxml
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop
          .venv/bin/pytest -q
