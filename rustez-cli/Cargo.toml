[package]
name = "rustez-cli"
version = "0.1.0"
edition = "2021"
authors = ["fastrevmd-lab"]
description = "CLI for rustEZ — Junos device automation from the terminal"
license = "MIT"
repository = "https://github.com/fastrevmd-lab/rustez"
# not published to crates.io.
publish = false

[dependencies]
rustez = { path = "../rustez" }
rustnetconf = "0.16.2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
