[package]
name = "rustez-py"
version = "0.15.0"
edition = "2021"
authors = ["fastrevmd-lab"]
description = "Python bindings for rustEZ — pip install rustez"
license = "MIT"
repository = "https://github.com/fastrevmd-lab/rustez"
# published to PyPI via maturin, not crates.io.
publish = false

[lib]
name = "_rustez_native"
crate-type = ["cdylib"]

[dependencies]
rustez = { path = "../rustez" }
rustnetconf = "0.15.0"
pyo3 = { version = "0.29", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
